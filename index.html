<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Testkaart</title>

<link rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html,body,#map{
  height:100%;
  margin:0;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([51.825,4.70],13);

L.tileLayer(
  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution:'&copy; OpenStreetMap'
  }
).addTo(map);
</script>

</body>
