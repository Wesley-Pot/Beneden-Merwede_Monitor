<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Beneden-Merwede AIS Monitor</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
    height: 100%;
    margin: 0;
}

#panel {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 1000;

    background: white;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

#apikey {
    width: 250px;
}

button {
    width: 100%;
    margin-top: 5px;
}
</style>
</head>

<body>

<div id="panel">
    <input
        id="apikey"
        type="text"
        placeholder="AISStream API key">

    <button onclick="connectAIS()">
        Verbinden
    </button>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map');
map.fitBounds([
    [51.818, 4.70],
    [51.827, 4.74]
]);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

const vessels = {};

const ferries = {
    "244750274": "GORINCHEM VI",
    "244830746": "MRD STRIKER",
    "244750693": "MRD TRANSFER"
};

function createIcon(color) {
    return L.divIcon({
        className: '',
        html: `
            <div style="
                width:12px;
                height:12px;
                border-radius:50%;
                background:${color};
                border:2px solid white;
            "></div>
        `,
        iconSize: [12,12]
    });
}

function connectAIS() {

    const apiKey =
        document.getElementById("apikey").value;

    if (!apiKey) {
        alert("Voer eerst je AISStream API key in");
        return;
    }

    localStorage.setItem(
        "aisstream_key",
        apiKey
    );

    const ws = new WebSocket(
        "wss://stream.aisstream.io/v0/stream"
    );

    ws.onopen = () => {

        console.log("Verbonden met AISStream");

        ws.send(JSON.stringify({
            APIKey: apiKey,
            BoundingBoxes: [
                [
                    [51.818, 4.70],
                    [51.827, 4.74]
                ]
            ],
            FilterMessageTypes: [
                "PositionReport"
            ]
        }));
    };

    ws.onmessage = async (event) => {

        const text = await event.data.text();

        let msg;

        try {
            msg = JSON.parse(text);
        }
        catch {
            return;
        }

        if (msg.MessageType !== "PositionReport") {
            return;
        }

        const meta = msg.MetaData;
        const report = msg.Message.PositionReport;

        if (!meta || !report) {
            return;
        }

        const mmsi = String(meta.MMSI);
        if (!ferries[mmsi]) {
            return;
        }
        
        const lat = report.Latitude;
        const lon = report.Longitude;

        const ferry = ferries[mmsi];

        let marker = vessels[mmsi];

        if (!marker) {

            marker = L.marker(
                [lat, lon],
                {
                    icon: createIcon(
                        ferry ? "#0078ff" : "#666666"
                    )
                }
            );

            marker.addTo(map);

            vessels[mmsi] = marker;

        } else {

            marker.setLatLng([lat, lon]);
        }

       marker.bindTooltip(
            ferries[mmsi],
            {
                permanent: true,
                direction: 'right'
            }
        );
    };

    ws.onerror = (err) => {
        console.log("WebSocket fout", err);
    };

    ws.onclose = (event) => {
        console.log(
            "Verbinding gesloten",
            event.code,
            event.reason
        );
    };
}

const savedKey =
    localStorage.getItem("aisstream_key");

if (savedKey) {
    document.getElementById("apikey").value =
        savedKey;
}

</script>

</body>
</html>
