<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kaart Test</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body, #map {
    height: 100%;
    margin: 0;
}
</style>

</head>
<body>

<div style="position:absolute;z-index:1000;background:white;padding:10px;">
<input id="apikey" placeholder="AISStream API Key">
</div>
    
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const ws = new WebSocket("wss://stream.aisstream.io/v0/stream");

ws.onopen = () => {

    console.log("Verbonden met AISStream");

    ws.send(JSON.stringify({
        APIKey: document.getElementById("apikey").value,
        BoundingBoxes: [
            [
                [51.815, 4.63],
                [51.84, 4.77]
            ]
        ],
        FilterMessageTypes: [
            "PositionReport"
        ]
    }));

};

ws.onmessage = (event) => {
    console.log(JSON.parse(event.data));
};

ws.onerror = (err) => {
    console.log("WS ERROR", err);
};

ws.onclose = () => {
    console.log("Verbinding gesloten");
};
</script>

</body>
</html>
